<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopi Sela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4EE;--card:#FEFCF8;--g:#536B50;--gl:#E4EBDB;--tx:#2E2A25;--mu:#8A7F74;--bd:#E8E1D3;--sf:'Lora',Georgia,serif;--sn:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#E9E4DA;font-family:var(--sn);color:var(--tx);display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--g);outline-offset:2px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone{width:390px;height:min(844px,100dvh);background:var(--bg);position:relative;overflow:hidden;border-radius:36px;box-shadow:0 20px 60px rgba(60,45,30,.18);display:flex;flex-direction:column}
@media(max-width:430px){body{background:var(--bg)}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}
.sb{height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font-weight:600;font-size:15px;flex:none}
.sb .r{display:flex;gap:6px;font-size:16px}
.sc{flex:1;display:flex;flex-direction:column;min-height:0}
.body{flex:1;overflow-y:auto;padding:0 20px 20px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.serif{font-family:var(--sf);font-weight:400}
.mu{color:var(--mu)}
/* menu */
.top{display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.logo{font:400 31px var(--sf);letter-spacing:-.5px}
.loc{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:4px}
.loc svg{color:var(--g);font-size:16px}
.hi{font-size:13px;color:var(--mu);letter-spacing:.3px;margin-top:20px}
h1{font:400 32px/1.2 var(--sf);margin-top:6px;letter-spacing:-.3px}
.search{display:flex;align-items:center;gap:10px;height:48px;border:1px solid var(--bd);background:var(--card);border-radius:24px;padding:0 18px;margin-top:26px;color:var(--mu)}
.search input{flex:1;border:0;background:none;font:400 14px var(--sn);color:var(--tx);min-width:0}
.search input::placeholder{color:var(--mu)}.search input:focus-visible{outline:0}
.search:focus-within{border-color:var(--g)}
.ban{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;background:var(--gl);border-radius:20px;padding:20px 18px 20px 18px;margin-top:22px;color:var(--g)}
.ban small{font-size:11px;letter-spacing:2px;font-weight:600}
.ban .t{font:400 26px var(--sf);color:var(--tx);margin:8px 0 6px}
.ban .s{font-size:13px}
.ban img{width:96px;height:96px;border-radius:50%;object-fit:cover}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px}
.mh h2{font:400 28px var(--sf)}.mh span{font-size:12.5px;color:var(--mu)}
.chips{display:flex;gap:10px;margin:14px 0 16px}
.chip{height:40px;padding:0 22px;border-radius:20px;border:1px solid var(--bd);background:var(--card);font-size:14px;color:var(--mu)}
.chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px}
.it{position:relative}
.it .im{display:block;width:100%;text-align:left}
.it img.p{width:100%;aspect-ratio:1/.79;object-fit:cover;border-radius:20px;display:block}
.fv{position:absolute;left:8px;top:8px;background:var(--card);color:var(--g);font-size:11.5px;font-weight:500;padding:5px 12px;border-radius:14px}
.it h3{font:600 16px var(--sn);margin-top:12px}.it p{font-size:12px;color:var(--mu);margin-top:3px}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.pr b{font-weight:600;font-size:16px}
.add{width:38px;height:38px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-size:20px}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);font-size:14px;padding:30px 0}
.dock{flex:none;background:var(--bg)}
.cbar{display:flex;justify-content:space-between;align-items:center;background:var(--g);color:#fff;margin:0 20px 10px;height:56px;border-radius:28px;padding:0 24px;font-weight:600;font-size:15px;width:calc(100% - 40px)}
.cbar span{display:flex;gap:8px;align-items:center}
.nav{display:flex;background:var(--card);padding:10px 0 4px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu);padding:4px}
.nav svg{font-size:26px}.nav button[aria-current=page]{color:var(--g);font-weight:600}
.hb{height:20px;display:flex;justify-content:center;align-items:flex-start;background:var(--card);flex:none;padding-top:6px}
.hb i{width:130px;height:5px;border-radius:3px;background:var(--tx)}
/* detail */
.hero{position:relative;height:260px;flex:none}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.cir{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:20px;border:1px solid var(--bd)}
.hero .cir{position:absolute;top:16px;border:0}
.hero .bk{left:20px}.hero .hrt{right:20px}
.hrt[aria-pressed=true] svg{fill:#c0584a;stroke:#c0584a}
.hero .fv{top:auto;bottom:14px;left:20px;display:flex;align-items:center;gap:6px;padding:7px 12px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}
.dh h2{font:400 31px var(--sf)}.dh b{color:var(--g);font-weight:600;font-size:18px}
.dd{font-size:14px;line-height:1.6;color:var(--mu);margin-top:10px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec b{font-weight:600;font-size:16px}.sec span{font-size:12px;color:var(--mu)}
.row{display:flex;gap:10px}
.opt{flex:1;min-height:48px;border:1px solid var(--bd);background:var(--card);border-radius:12px;font-size:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt small{font-size:10.5px;color:var(--mu)}
.opt[aria-pressed=true]{background:var(--gl);border-color:var(--g);color:var(--g);font-weight:600}
.opt[aria-pressed=true] small{color:var(--g);font-weight:400}
.ad{display:flex;align-items:center;gap:12px;width:100%;height:52px;margin-bottom:4px;font-size:14px}
.ad .ck{width:28px;height:28px;border-radius:7px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;color:#fff;font-size:16px}
.ad[aria-checked=true] .ck{background:var(--g);border-color:var(--g)}
.ad .ck svg{opacity:0}.ad[aria-checked=true] .ck svg{opacity:1}
.ad em{margin-left:auto;font-style:normal;font-size:13px;color:var(--mu)}
.note{width:100%;height:50px;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:0 16px;font:400 13px var(--sn);color:var(--tx)}
.note::placeholder{color:var(--mu)}
.ft{flex:none;background:var(--card);border-top:1px solid var(--bd);padding:14px 20px 8px}
.ft .q{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ft .q>b{font-size:22px;font-weight:600}
.qt{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:20px;height:36px;background:var(--card)}
.qt button{width:36px;height:34px;display:grid;place-items:center;font-size:18px}
.qt span{min-width:20px;text-align:center;font-size:14px;font-weight:500}
.cta{width:100%;height:56px;border-radius:28px;background:var(--g);color:#fff;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;padding:0 24px}
/* steps */
.sh{display:flex;align-items:center;gap:0;padding:8px 20px 0;position:relative;flex:none}
.sh .cir{width:40px;height:40px;background:var(--bg);border-color:var(--bd)}
.sh .st{position:absolute;left:0;right:0;text-align:center;font-size:12px;letter-spacing:2px;color:var(--mu);pointer-events:none}
.pg{font:400 34px var(--sf);margin:22px 0 18px}
.stbox{display:flex;gap:12px;align-items:center;background:var(--gl);border-radius:12px;padding:14px 16px;color:var(--g)}
.stbox svg{font-size:22px}.stbox b{font-size:14px;font-weight:600;display:block}.stbox span{font-size:12.5px}
.ci{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-top:14px}
.ci .t{display:flex;gap:16px}.ci img{width:84px;height:84px;border-radius:14px;object-fit:cover}
.ci h3{font:600 16px var(--sn)}.ci p{font-size:12px;color:var(--mu);line-height:1.6;margin-top:6px}.ci b.pp{display:block;font-weight:600;margin-top:4px;font-size:15px}
.ci .b{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);margin-top:14px;padding-top:12px}
.ci .b div{display:flex;align-items:center;gap:16px;color:var(--mu);font-size:18px}
.lk{color:var(--g);font-size:13px;font-weight:600}
.more{display:flex;justify-content:space-between;align-items:center;padding:22px 0 18px;border-bottom:1px solid var(--bd)}
.more span{font:400 18px var(--sf)}.more button{display:flex;gap:6px;align-items:center}
.h2{font:400 28px var(--sf);margin:20px 0 14px}
.ln{display:flex;justify-content:space-between;font-size:16px;color:var(--mu);padding:5px 0}
.ln.tot{border-top:1px solid var(--bd);margin-top:8px;padding-top:14px;color:var(--tx);font-weight:600}
.ln.tot b{font-size:20px}
.fn{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mu);margin-top:16px}.fn svg{color:var(--g);font-size:20px}
.ft .tt{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mu);font-size:14px}.ft .tt b{color:var(--tx);font-size:22px;font-weight:600}
/* pay */
.h3{font:400 24px var(--sf);margin:20px 0 12px}
.ch{display:flex;gap:12px}
.ch>button{flex:1;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;position:relative;min-height:92px;display:flex;flex-direction:column;gap:12px}
.ch>button[aria-checked=true],.pm[aria-checked=true]{background:var(--gl);border-color:var(--g)}
.ch b{font-size:14px;font-weight:600}.ch small{display:block;font-size:11.5px;color:var(--mu);font-weight:400;margin-top:3px}
.ch>button[aria-checked=true] b{color:var(--g)}
.rd{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd);background:var(--card);flex:none;display:grid;place-items:center}
[aria-checked=true]>.rd,[aria-checked=true] .rd{border:0;background:var(--g)}
[aria-checked=true] .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:#fff}
.ch .rd{position:absolute;right:12px;top:12px}
.ch svg{font-size:22px;color:var(--mu)}.ch>button[aria-checked=true] svg{color:var(--g)}
.box{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-top:12px}
.box>svg{font-size:26px;color:var(--g)}.box div{flex:1}.box small{font-size:12px;color:var(--mu);display:block}.box b{font-size:20px;font-weight:600}.box b.nm{font-size:15px}
.hint{font-size:12px;color:var(--mu);margin-top:12px}
.pm{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:10px}
.pm>svg{font-size:26px;color:var(--mu)}.pm div{flex:1}.pm b{font-size:15px;font-weight:600;display:block}.pm small{font-size:12px;color:var(--mu)}
.pm.pl{border:0;background:none;padding:6px 16px}.pm.pl b{font-weight:400;font-size:14px}
.ps{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--bd);margin-top:14px;padding-top:20px}
.ps h2{font:400 28px var(--sf)}.ps span{font-size:12px;color:var(--mu)}
.sm{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);padding:5px 0}.sm.l{font-size:16px}
.ft .sc2{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:var(--mu);margin-bottom:12px}.ft .sc2 svg{color:var(--g);font-size:16px}
/* done */
.dn{text-align:center}
.big{width:100px;height:100px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;margin:22px auto 20px;font-size:38px}
.dn h2{font:400 30px var(--sf)}.dn p{font-size:14px;line-height:1.6;color:var(--mu);margin-top:10px}
.oc{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-top:28px;text-align:left}
.oc .a{display:flex;justify-content:space-between;align-items:center}
.oc small{font-size:11px;letter-spacing:1.5px;color:var(--mu)}.oc .no{font:400 34px var(--sf);margin-top:6px}
.badge{background:var(--gl);color:var(--g);font-size:12px;font-weight:600;padding:6px 14px;border-radius:16px;display:flex;gap:6px;align-items:center}
.oc .c{display:flex;justify-content:space-between;border-top:1px solid var(--bd);margin-top:16px;padding-top:16px}
.oc .c small{display:block;letter-spacing:0;font-size:12px}.oc .c b{font-size:20px;font-weight:600}.oc .c div:last-child{text-align:right}.oc .c div:last-child b{color:var(--g)}
.tl{margin-top:8px}
.tl .s{display:flex;gap:14px;position:relative;padding-bottom:22px}
.tl .s:last-child{padding-bottom:0}
.tl .s:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--bd)}
.tl .s.dn1:not(:last-child)::before{background:var(--g)}
.tl .d{width:40px;height:40px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-size:18px;flex:none}
.tl .on .d{background:var(--g);color:#fff}.tl .of .d{background:#EDE6DA;color:var(--mu)}
.tl b{font-size:15px;font-weight:600;display:block;margin-top:2px}.tl small{font-size:12.5px;color:var(--mu)}.tl .of b{color:var(--mu);font-weight:500}
.rc{background:#EEE6DA;border-radius:16px;padding:18px;margin-top:20px;text-align:left}
.rc .a{display:flex;justify-content:space-between;font-size:14px}.rc .a b{font-weight:600}
.rc p{font-size:12.5px;color:var(--mu);line-height:1.8;margin-top:12px}
.rc .z{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #DDD3C2;margin-top:12px;padding-top:12px;font-size:13px;color:var(--mu)}.rc .z b{font-size:17px;color:var(--tx);font-weight:600}
.hlp{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--g);font-weight:600;font-size:14px;width:100%;margin-top:16px;padding:6px}
.cta.c1{justify-content:flex-start}
.mt{margin-top:16px}
.ac{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-top:20px}
.ac .av{width:56px;height:56px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-size:26px}
.ac b{font-size:17px;font-weight:600;display:block}.ac small{color:var(--mu);font-size:13px}
.em{text-align:center;color:var(--mu);font-size:14px;padding:50px 20px;line-height:1.6}.em svg{font-size:44px;color:var(--g);margin-bottom:12px}
</style>
</head>

function R(){const a=document.activeElement,k=a&&a.dataset&&a.dataset.f;const b=document.querySelector('.body'),y=b?b.scrollTop:0,same=R.s===S.scr;
